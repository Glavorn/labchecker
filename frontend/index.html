<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>LabChecker</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header>
    <h1>LabChecker</h1>
  </header>

  <main>
    <section>
      <h2>Добавить студента</h2>
      <form id="student-form">
        <label>ФИО
          <input type="text" id="student-name" required />
        </label>
        <label>Telegram (необязательно)
          <input type="text" id="student-telegram" placeholder="@username" />
        </label>
        <button type="submit">Добавить студента</button>
      </form>
    </section>

    <section>
      <h2>Добавить лабу</h2>
      <form id="lab-form">
        <label>Название
          <input type="text" id="lab-title" required />
        </label>
        <label>Язык
          <select id="lab-language" required>
            <option value="python">Python</option>
            <option value="bash">Bash</option>
          </select>
        </label>
        <label>Описание (необязательно)
          <textarea id="lab-description" rows="3"></textarea>
        </label>
        <button type="submit">Добавить лабу</button>
      </form>
    </section>

    <section>
      <h2>Загрузить сдачу</h2>
      <form id="upload-form">
        <label>Студент
          <select id="student-select" required></select>
        </label>
        <label>Лаба
          <select id="lab-select" required></select>
        </label>
        <label>Файл или ZIP-архив проекта
          <input type="file" id="file-input" accept=".py,.sh,.zip" required />
        </label>
        <button type="submit">Отправить на проверку</button>
      </form>
    </section>

    <section>
      <h2>Сдачи</h2>
      <table id="submissions-table">
        <thead>
          <tr>
            <th>Студент</th>
            <th>Лаба</th>
            <th>Файл</th>
            <th>Статус</th>
            <th>Вывод проверки</th>
            <th>Дата</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>
  </main>

  <script type="module" src="js/main.js"></script>
</body>
</html>
